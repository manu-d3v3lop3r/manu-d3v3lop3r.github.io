# Keeps Astro, its integrations and the GitHub Actions used for deployment up to date.
# Dependabot opens a pull request for each update; review it and merge after the build passes.
version: 2

updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      astro:
        patterns:
          - "astro"
          - "@astrojs/*"
      tooling:
        patterns:
          - "typescript"
      site-build:
        patterns:
          - "satori"
          - "@fontsource/*"
          - "@fontsource-variable/*"
    ignore:
      # @astrojs/check only supports TypeScript 5–6 for now.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
